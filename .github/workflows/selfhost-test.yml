name: Test the self-hosted server
# Runs selfhost/test when the server, the planner, the site app or the live-project server change.
on:
  push:
    paths: ["selfhost/**", "server/worker.js", "index.html", "site.html", "sw.js"]
  pull_request:
    paths: ["selfhost/**", "server/worker.js", "index.html", "site.html", "sw.js"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd selfhost && npm test
